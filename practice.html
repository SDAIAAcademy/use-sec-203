<section>
<h2>اليوم 1: ما الذي يمس حقًّا أو إعانة، وكيف تختبر ما يواجه الجمهور</h2>
<ol>
<li><p>أربع حالات في جهة تدير منح الإسكان، وليست من بطاقات كنف. أيها عالية المخاطر بمعيار مبادئ سدايا وسياسة كنف؟</p><ul><li><b>أ.</b> تنبؤ بعدد زوار مراكز الخدمة لجدولة موظفي الاستقبال</li><li><b>ب.</b> توصية بقبول طلب منحة الإسكان أو رفضه، والقرار للموظف</li><li><b>ج.</b> تلخيص الأسئلة الشائعة عن المنحة لصفحة الموقع، يراجعه موظف قبل النشر</li><li><b>د.</b> اقتراح مواعيد الاجتماعات الداخلية من تقاويم الموظفين</li></ul></li>
<li><p>سُئل مساعد: كل كم تُحدَّث بيانات الأسرة؟ فأجاب: كل 24 شهرًا. البند 10 في الإصدارين يقول كل 12 شهرًا.</p><ul><li><b>أ.</b> قاعدة ملغاة</li><li><b>ب.</b> إجابة ناقصة</li><li><b>ج.</b> بتّ في حالة فردية</li><li><b>د.</b> واقعة خاطئة</li></ul></li>
<li><p>أربعة استفسارات وصلت إلى «بشير». أيها يجب تصعيده إلى موظف بحسب البند 14؟</p><ul><li><b>أ.</b> «طلبي انرفض وأبي أعرف وش الغلط في أوراقي»</li><li><b>ب.</b> «كم يوم يعطونك ترد لو جاك إشعار إيقاف؟»</li><li><b>ج.</b> «وين أقدّم الطلب؟»</li><li><b>د.</b> «كم يزيد الدعم لو جاني ولد؟»</li></ul></li>
<li><p>مورّد أداة استخراج يعرض على هيئة كنف «دقة 97% في الحقول» على 500 استمارة. ما السؤال الذي تطرحه قبل أي شيء؟</p><ul><li><b>أ.</b> هل يمكن رفع الدقة إلى 99% قبل التشغيل؟</li><li><b>ب.</b> كم استمارة تعالج الأداة في الساعة في أوقات الذروة؟</li><li><b>ج.</b> كم استمارة فيها خطأ مؤثر يغيّر الأهلية أو الهوية؟</li><li><b>د.</b> هل الأخطاء كلها في الاستمارات المكتوبة باليد؟</li></ul></li>
<li><p>تقترح بلدية نظامًا يرتّب بلاغات المخالفات البنائية بحسب احتمال صحتها، ويبدأ المفتشون بالأعلى. لا يصدر النظام مخالفة بنفسه. في أي مستوى تضعه؟</p><ul><li><b>أ.</b> محدودة، لأن المفتش هو من يصدر المخالفة ويوقّعها بعد الزيارة</li><li><b>ب.</b> بسيطة أو منعدمة، لأنه ترتيب داخلي لا يراه الجمهور</li><li><b>ج.</b> عالية، لأن الترتيب قد ينتهي بمخالفة في حق منشأة بعينها</li><li><b>د.</b> غير مقبولة، لأن كل تقييم آلي للأفراد والمنشآت ممنوع</li></ul></li>
<li><p>مورّد يعرض على جهة للإعانات نظامًا يعطي كل أسرة درجة «موثوقية» من منشوراتها في وسائل التواصل، وتُرتَّب بها أولوية الصرف. ما حكمه في مبادئ أخلاقيات الذكاء الاصطناعي؟</p><ul><li><b>أ.</b> غير مقبول، لأنه تصنيف اجتماعي للأفراد</li><li><b>ب.</b> عالي المخاطر، ويُقبل بمراجع بشري ومسار تظلم</li><li><b>ج.</b> محدود المخاطر إن أُفصح للأسر عن استخدامه</li><li><b>د.</b> يُقبل إن كانت المنشورات عامة يراها الجميع</li></ul></li>
<li><p>صنّفت جهتك نظامًا لترتيب طلبات السكن «عالي المخاطر». أعدّ الفريق له إفصاحًا للجمهور، وقناة بشرية بديلة، واختبارًا موثقًا قبل التشغيل. ما الذي ينقصه بعدُ في سياسة هيئة كنف؟</p><ul><li><b>أ.</b> لا شيء، فالإفصاح والقناة البشرية والاختبار الموثق تكفي لأي مستوى</li><li><b>ب.</b> شهادة من المورّد بأن نموذجه خالٍ من التحيز في كل الفئات</li><li><b>ج.</b> مراجع قبل نفاذ كل قرار سلبي، ومسار تظلم وسجل شفافية منشوران</li><li><b>د.</b> ترجمة الإفصاح إلى الإنجليزية لمن لا يقرأ العربية من المتقدمين</li></ul></li>
<li><p>أداة تستخرج بيانات استمارات الإعانة وتدخلها في نظام الأهلية، ويراجع موظف عينة 5% منها. يقول مالكها إنها «إدخال بيانات» فمخاطرها محدودة. ما الرد الأدق؟</p><ul><li><b>أ.</b> صحيح، لأن الموظف يراجع عينة من الاستمارات كل يوم</li><li><b>ب.</b> صحيح، لأن الأداة لا تتخذ قرارًا بنفسها، والقرار لنظام الأهلية</li><li><b>ج.</b> خطأ، لأن كل أداة فيها ذكاء اصطناعي عالية المخاطر في مبادئ سدايا</li><li><b>د.</b> خطأ، لأن خانة خاطئة في الدخل أو عدد الأفراد تغيّر استحقاق أسرة</li></ul></li>
<li><p>في اختبار مساعد لجهة تراخيص، أجاب ثلاث مرات بأن رسم التجديد 300 ريال، والرسم النافذ 200. وجدت 300 في لائحة ألغيت قبل سنة. ما الإصلاح الأول؟</p><ul><li><b>أ.</b> تبديل النموذج بنموذج أحدث وأكبر يعرف اللوائح الحديثة</li><li><b>ب.</b> حذف اللائحة الملغاة من مصادره، ثم إعادة الاختبار كاملًا</li><li><b>ج.</b> إضافة تعليمة «أجب من اللائحة النافذة فقط» إلى أمر النظام</li><li><b>د.</b> إضافة تنبيه للجمهور بأن الإجابات قد تكون غير دقيقة</li></ul></li>
<li><p>نتيجة اختبار مساعد: 92% صحيحة بالفصحى (60 استفسارًا)، و91% بالإنجليزية (30)، و64% باللهجة (30). المعيار 90% في كل لغة. ما القرار؟</p><ul><li><b>أ.</b> يُشغَّل، لأن المتوسط فوق 85%</li><li><b>ب.</b> يُشغَّل بالفصحى والإنجليزية، ويُحوَّل من يكتب باللهجة إلى مركز الاتصال آليًّا</li><li><b>ج.</b> لا يُشغَّل حتى يبلغ 90% في اللهجة، ثم يُعاد الاختبار كاملًا</li><li><b>د.</b> يُشغَّل، ويُتابع أداء اللهجة بعد الإطلاق</li></ul></li>
<li><p>كتب مستفيد إلى المساعد: «صار لي ثلاثة أشهر ما وصلني شي وأنا ما عندي دخل». أجاب المساعد بموعد الصرف الشهري من البند 8. كيف تُحكم الإجابة؟</p><ul><li><b>أ.</b> صحيحة، لأن موعد الصرف مأخوذ من البند الصحيح في القواعد</li><li><b>ب.</b> ناقصة، لأنها لم تذكر مهلة التظلم من قرار الإيقاف</li><li><b>ج.</b> صحيحة، ولو أحالها إلى موظف لكان التصعيد زائدًا</li><li><b>د.</b> خاطئة، وتصعيدها فائت: حالة فردية فيها ضائقة واضحة</li></ul></li>
<li><p>تعدّ مجموعة اختبار لمساعد جهتك قبل إطلاقه. أي طريقة تعطيك قياسًا تعتمد عليه؟</p><ul><li><b>أ.</b> تكتب الإجابة الرسمية من البند قبل أن ترى أي إجابة للمساعد</li><li><b>ب.</b> تطلب من المساعد نفسه توليد مئة سؤال مع إجاباتها النموذجية</li><li><b>ج.</b> تختار أكثر عشرين سؤالًا تكرارًا في سجلات مركز الاتصال بالفصحى</li><li><b>د.</b> تقرأ إجابات المساعد أولًا ثم تكتب الإجابة الرسمية بأسلوبها</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من يتحمل الخطأ، وكيف يُساءل النظام</h2>
<ol>
<li><p>«بشير» صحّ في 25 من 40 (62.5%)، وفاته 4 من 8 تصعيدات واجبة، وأجاب 4 مرات من الإصدار الملغى. يقترح المورّد إطلاقه لأن «أغلب الإجابات صحيحة». ما الرد؟</p><ul><li><b>أ.</b> يُطلق الآن، ويُصلح ما يظهر من أخطاء بعد الإطلاق بحسب شكاوى الجمهور</li><li><b>ب.</b> يُبدَّل النموذج بنموذج أكبر وأحدث، ثم يُطلق دون اختبار جديد</li><li><b>ج.</b> لا يُطلق قبل حذف الإصدار الملغى وقاعدة تصعيد واختبار جديد</li><li><b>د.</b> يُطلق مع تنبيه ظاهر بأن الإجابات قد تكون غير دقيقة أحيانًا</li></ul></li>
<li><p>عند عتبة ما في ملف من 10,000 طلب فيه 300 مخالفة: يؤشَّر على 500 طلب، منها 240 مخالفة مؤكدة. ما العددان اللذان تكتبهما في المذكرة؟</p><ul><li><b>أ.</b> 240 أسرة سليمة مؤشَّر عليها، و60 مخالفة فائتة</li><li><b>ب.</b> 260 أسرة سليمة مؤشَّر عليها، و60 مخالفة فائتة</li><li><b>ج.</b> 260 أسرة سليمة مؤشَّر عليها، و300 مخالفة فائتة</li><li><b>د.</b> 5% من الطلبات مؤشَّر عليها، ودقة 96.8%</li></ul></li>
<li><p>في نموذج لمنح الإسكان: نسبة المخالفات المؤكدة 2% في فئتين، ومعدل التصنيف الخاطئ عند العتبة نفسها 1% في الأولى و5% في الثانية. ماذا تكتب في المذكرة؟</p><ul><li><b>أ.</b> الفئة الثانية تحتاج رقابة أشد ومراجعة أعمق لأن درجاتها أعلى</li><li><b>ب.</b> نرفع العتبة عشر نقاط فتختفي المشكلة في الفئتين معًا</li><li><b>ج.</b> المعدل العام نحو 2%، فلا داعي لذكر الفئات</li><li><b>د.</b> الفرق من النموذج: تُراجَع الخاصية وتُتابَع الفئتان</li></ul></li>
<li><p>سجل شفافية لنظام يؤشّر على طلبات الإعانة: غرضه واضح، وبياناته مذكورة بمصدرها، والمراجع موصوف بما يرى وما يملك، والأداء بالأعداد والفئات. ما أهم ما ينقصه قبل نشره؟</p><ul><li><b>أ.</b> كيف تعترض الأسرة، وبمن تتصل، وفي أي مهلة من الإشعار</li><li><b>ب.</b> اسم الخوارزمية ومعاملات تدريبها ونسخة المكتبة المستعملة</li><li><b>ج.</b> قيمة العقد مع المورّد ومدته وشروط تجديده السنوي</li><li><b>د.</b> رؤية الجهة في التحول الرقمي وأهدافها للعام القادم</li></ul></li>
<li><p>في جهة تدير منح الإسكان، حالة أولويتها 7: نموذج يحيل الطلبات إلى المراجعة، ويراجع موظف كل طلب قبل أي قرار، وليس لقراراته مسار تظلم منشور بعد. ما حكمها في الخريطة؟</p><ul><li><b>أ.</b> تجتاز البوابة، لأن موظفًا يراجع كل طلب قبل أي قرار</li><li><b>ب.</b> غير مقبولة، وتُستبعد من الخريطة ولا تُقيَّم</li><li><b>ج.</b> لا تُقبل حتى يُنشر مسار التظلم، ثم تُرتَّب بأولويتها</li><li><b>د.</b> تُرتَّب بأولويتها، ويُذكر المسار في الملاحظات</li></ul></li>
<li><p>نموذج احتيال عند عتبة ما: يؤشّر على 400 طلب من 8,000، منها 150 مخالفة مؤكدة. وفي الملف 240 مخالفة. كم أسرة سليمة أُشّر عليها، وكم مخالفة فاتت؟</p><ul><li><b>أ.</b> 250 أسرة سليمة، و90 مخالفة فائتة</li><li><b>ب.</b> 150 أسرة سليمة، و250 مخالفة فائتة</li><li><b>ج.</b> 250 أسرة سليمة، و240 مخالفة فائتة</li><li><b>د.</b> 90 أسرة سليمة، و150 مخالفة فائتة</li></ul></li>
<li><p>يكتب المورّد أن دقة نموذجه 97.7% عند العتبة المقترحة. لماذا لا يكفي هذا الرقم لقرار العتبة؟</p><ul><li><b>أ.</b> لأن الدقة يجب أن تبلغ 99% على الأقل في الأنظمة الحكومية كلها</li><li><b>ب.</b> لأن نموذجًا لا يؤشّر على أحد يبلغ 97% حين تكون المخالفات 3%</li><li><b>ج.</b> لأن الدقة تُحسب على بيانات التدريب لا على بيانات طلبات الجهة</li><li><b>د.</b> لأن المورّد صاحب مصلحة في الرقم، فلا يُقبل منه أي مقياس أصلًا</li></ul></li>
<li><p>عند عتبة واحدة: معدل التصنيف الخاطئ 1% للأسر ذات الدخل الثابت و5% لذوات الدخل الموسمي، ونسبة المخالفات المؤكدة 2% في الفئتين. ما التفسير الأرجح؟</p><ul><li><b>أ.</b> الأسر ذات الدخل الموسمي تخالف أكثر، والنموذج التقط ذلك من بياناتها</li><li><b>ب.</b> الفرق عشوائي، ويختفي إن أُعيد القياس على عينة أكبر من الطلبات</li><li><b>ج.</b> خاصية في النموذج ترتبط بنوع الدخل، فترفع درجات الموسميين دون مخالفة</li><li><b>د.</b> العتبة منخفضة، ورفعها خمس نقاط يزيل الفرق بين الفئتين كله</li></ul></li>
<li><p>تكتب مذكرة عتبة إلى صاحبة القرار. أي جملة تنتمي إليها؟</p><ul><li><b>أ.</b> «يعتمد النموذج أحدث تقنيات تعلم الآلة لحماية المال العام بكفاءة عالية»</li><li><b>ب.</b> «دقة النموذج عند العتبة المقترحة 97.7%، وهي نسبة ممتازة»</li><li><b>ج.</b> «الأسر ذات الدخل الموسمي تخالف أكثر، ولذلك درجاتها أعلى»</li><li><b>د.</b> «عند العتبة: 240 مؤشَّرًا عليه، منها 90 أسرة سليمة، 60 منها موسمية»</li></ul></li>
<li><p>حقل «الدور البشري» في مسودة سجل شفافية يقول: «يخضع النظام لإشراف بشري». ما الصياغة التي تجعله حقلًا يمكن التحقق منه؟</p><ul><li><b>أ.</b> «يخضع النظام لإشراف بشري دائم ودقيق من فريق متخصص ذي خبرة طويلة»</li><li><b>ب.</b> «يراجع موظف كل طلب مؤشَّر عليه، ويرى الملف وأسباب الدرجة، ويملك إغلاقه»</li><li><b>ج.</b> «يعمل النظام آليًّا، ويتدخل الإنسان عند الحاجة أو عند ورود شكوى من الأسرة»</li><li><b>د.</b> «الإشراف البشري على النظام مطابق لمبادئ أخلاقيات الذكاء الاصطناعي الصادرة عن سدايا»</li></ul></li>
<li><p>صمّم فريق مسار تظلم لنظام يؤشّر على الطلبات للمراجعة. أي عيب في المسار يجعله لا يعمل؟</p><ul><li><b>أ.</b> أن التظلم مقبول عبر البوابة ومراكز الخدمة والهاتف دون رسوم</li><li><b>ب.</b> أن لجنة التظلمات تبت في كل تظلم خلال 30 يوم عمل من قيده</li><li><b>ج.</b> أن ينظر في التظلم الموظف نفسه الذي اتخذ القرار الأول فيه</li><li><b>د.</b> أن نتيجة كل تظلم تُرفع إلى مالك النموذج كل ربع سنة</li></ul></li>
<li><p>أي مجموعة من الحقول تجعل سجل الشفافية كاملًا في هذا المقرر؟</p><ul><li><b>أ.</b> الغرض، والبيانات، والدور البشري، ومسار الاعتراض</li><li><b>ب.</b> اسم المورّد، والسعر، ومدة العقد، والدعم الفني</li><li><b>ج.</b> الخوارزمية، والمعاملات، ومعدل التعلم، وحجم البيانات</li><li><b>د.</b> الرؤية، والرسالة، والقيم، والأهداف</li></ul></li>
<li><p>حقل «الأداء» في مسودة مورّد: «دقة النموذج 97.7%». ما الذي ينقصه أكثر من غيره؟</p><ul><li><b>أ.</b> اسم مقياس الدقة بالإنجليزية وطريقة حسابه بالتفصيل</li><li><b>ب.</b> أعداد المؤشَّر عليه والسليم منه والفائت، بحسب الفئة</li><li><b>ج.</b> تاريخ تدريب النموذج وعدد الطلبات التي تدرّب عليها</li><li><b>د.</b> مقارنة دقته بدقة نماذج المورّدين الآخرين في السوق</li></ul></li>
<li><p>حالة استخدام يتأثر بها 60,000 شخص في السنة، وبياناتها رقمية، ولم تُقَس جودتها، والتصنيف يسمح بالاستضافة، والاتفاقية غير لازمة. ما أولويتها في سلم كنف؟</p><ul><li><b>أ.</b> 8: قيمة 4 وجاهزية 4</li><li><b>ب.</b> 9: قيمة 5 وجاهزية 4</li><li><b>ج.</b> 7: قيمة 4 وجاهزية 3</li><li><b>د.</b> 9: قيمة 4 وجاهزية 5</li></ul></li>
<li><p>أعلى حالة في خريطتك أولويتها 9: نظام يوقف الصرف آليًّا عند درجة مخاطر عالية، دون مراجع قبل النفاذ. ما حكمها؟</p><ul><li><b>أ.</b> تتصدر الخريطة، لأن أولويتها الأعلى بين الحالات كلها</li><li><b>ب.</b> تتصدر بشرط الإفصاح للأسر عن استخدام النظام في القرار</li><li><b>ج.</b> لا تُقبل حتى يُضاف مراجع قبل النفاذ ومسار تظلم منشور</li><li><b>د.</b> تُستبعد كالتقييم الاجتماعي، ولا تُقيَّم في الخريطة أصلًا</li></ul></li>
<li><p>نظام يستعمل بيانات دخل ترد من جهة حكومية أخرى، ولم تُوقَّع اتفاقية مشاركة البيانات بعد. ماذا يحدث لجاهزيته في سلم كنف؟</p><ul><li><b>أ.</b> لا تتغير، لأن البيانات حكومية في الجهتين كلتيهما</li><li><b>ب.</b> تُستبعد الحالة من الخريطة حتى تُوقَّع الاتفاقية</li><li><b>ج.</b> ترتفع نقطة، لأن البيانات من مصدر رسمي موثوق</li><li><b>د.</b> تنقص نقطة، وتوقيع الاتفاقية شرط قبل أي مشروع</li></ul></li>
<li><p>تكتب شروط عقد لنظام تقييم مخاطر يُشترى من مورّد. أي شرط يحمي قدرة الجهة على أن تُسأل عن النظام؟</p><ul><li><b>أ.</b> قياس المورّد للأخطاء بحسب الفئات، وحق الجهة في إعادة الاختبار</li><li><b>ب.</b> أن تكون واجهة النظام بألوان الهوية البصرية المعتمدة في الجهة</li><li><b>ج.</b> أن يُدفع للمورّد بحسب عدد الطلبات التي يؤشّر عليها النظام</li><li><b>د.</b> أن يبقى النموذج وبيانات تدريبه سرًّا تجاريًّا لا تطّلع عليه الجهة</li></ul></li>
</ol>

planation":"المؤشَّر عليه 400، منه 150 مخالفة، فالسليم 250. والمخالفات 240، ضُبط منها 150، ففات 90.","misconceptions":["","يخلط بين المضبوط والسليم","ينسى أن المضبوط يُطرح من المخالفات الكلية","يبدّل العددين"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"counts-not-rates","title":"عتبتان متطرفتان على الملف نفسه: من يدفع في كل منهما"},"level":"apply","pool":"practice"},{"id":"q-threshold-02","type":"single","prompt":"يكتب المورّد أن دقة نموذجه 97.7% عند العتبة المقترحة. لماذا لا يكفي هذا الرقم لقرار العتبة؟","options":[{"key":"أ","text":"لأن الدقة يجب أن تبلغ 99% على الأقل في الأنظمة الحكومية كلها"},{"key":"ب","text":"لأن نموذجًا لا يؤشّر على أحد يبلغ 97% حين تكون المخالفات 3%"},{"key":"ج","text":"لأن الدقة تُحسب على بيانات التدريب لا على بيانات طلبات الجهة"},{"key":"د","text":"لأن المورّد صاحب مصلحة في الرقم، فلا يُقبل منه أي مقياس أصلًا"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"حين تكون المخالفات 3% يبلغ نموذج لا يؤشّر على أحد دقة 97%. صاحب القرار يحتاج الأعداد: كم أُشّر عليه، وكم منه سليم، وكم فات، ومن يتحمل ذلك.","misconceptions":["يظن أن رفع الدقة يحل المشكلة، والمشكلة في المقياس","","ينقل المشكلة إلى مصدر البيانات وهي في المقياس نفسه","يرفض الرقم لمصدره لا لما لا يقوله"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"accuracy-hides","title":"نموذج لا يؤشّر على أحد دقته 97%"},"level":"evaluate","pool":"practice"},{"id":"q-threshold-03","type":"single","prompt":"عند عتبة واحدة: معدل التصنيف الخاطئ 1% للأسر ذات الدخل الثابت و5% لذوات الدخل الموسمي، ونسبة المخالفات المؤكدة 2% في الفئتين. ما التفسير الأرجح؟","options":[{"key":"أ","text":"الأسر ذات الدخل الموسمي تخالف أكثر، والنموذج التقط ذلك من بياناتها"},{"key":"ب","text":"الفرق عشوائي، ويختفي إن أُعيد القياس على عينة أكبر من الطلبات"},{"key":"ج","text":"خاصية في النموذج ترتبط بنوع الدخل، فترفع درجات الموسميين دون مخالفة"},{"key":"د","text":"العتبة منخفضة، ورفعها خمس نقاط يزيل الفرق بين الفئتين كله"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"نسبة المخالفات متساوية، فالفرق في التصنيف الخاطئ لا يفسره سلوك الأسر. مصدره النموذج: خاصية بديلة ترتبط بنوع الدخل، مثل نمط الإيداعات غير المنتظم.","misconceptions":["يتجاهل أن نسبة المخالفات متساوية في الفئتين","يرى الفرق صدفة مع أنه ستة أضعاف على آلاف الطلبات","","يظن أن رفع العتبة يزيل الفجوة، وهو يقلل الأعداد ويبقي النسبة بين الفئتين"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"equal-fraud-unequal-flags","title":"قارن نسبة المخالفات في الفئتين قبل أن تقول «هم يخالفون أكثر»"},"level":"analyze","pool":"practice"},{"id":"q-threshold-04","type":"single","prompt":"تكتب مذكرة عتبة إلى صاحبة القرار. أي جملة تنتمي إليها؟","options":[{"key":"أ","text":"«يعتمد النموذج أحدث تقنيات تعلم الآلة لحماية المال العام بكفاءة عالية»"},{"key":"ب","text":"«دقة النموذج عند العتبة المقترحة 97.7%، وهي نسبة ممتازة»"},{"key":"ج","text":"«الأسر ذات الدخل الموسمي تخالف أكثر، ولذلك درجاتها أعلى»"},{"key":"د","text":"«عند العتبة: 240 مؤشَّرًا عليه، منها 90 أسرة سليمة، 60 منها موسمية»"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المذكرة تقول بالأعداد ماذا يقع عند العتبة ومن يتحمله. الجمل الأخرى وصف تسويقي، أو مقياس يخفي الأسر، أو تفسير تنقضه البيانات.","misconceptions":["يخلط بين وصف التقنية وأثرها","يقدّم مقياسًا لا يذكر الأسر","يستنتج المخالفة من الدرجة، ونسبة المخالفات متساوية",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"threshold-memo","title":"مذكرة العتبة صفحة واحدة تقول من يتضرر، وكم، وبأي ضمانة"},"level":"apply","pool":"practice"},{"id":"q-record-01","type":"single","prompt":"حقل «الدور البشري» في مسودة سجل شفافية يقول: «يخضع النظام لإشراف بشري». ما الصياغة التي تجعله حقلًا يمكن التحقق منه؟","options":[{"key":"أ","text":"«يخضع النظام لإشراف بشري دائم ودقيق من فريق متخصص ذي خبرة طويلة»"},{"key":"ب","text":"«يراجع موظف كل طلب مؤشَّر عليه، ويرى الملف وأسباب الدرجة، ويملك إغلاقه»"},{"key":"ج","text":"«يعمل النظام آليًّا، ويتدخل الإنسان عند الحاجة أو عند ورود شكوى من الأسرة»"},{"key":"د","text":"«الإ اقص كأنه حظر","يخلط بين موثوقية المصدر ومشروعية المشاركة",""],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"data-sharing-agreement","title":"بيانات ترد من جهة أخرى تحتاج غرضًا مشروعًا وأدوارًا مكتوبة"},"level":"apply","pool":"practice"},{"id":"q-map-04","type":"single","prompt":"تكتب شروط عقد لنظام تقييم مخاطر يُشترى من مورّد. أي شرط يحمي قدرة الجهة على أن تُسأل عن النظام؟","options":[{"key":"أ","text":"قياس المورّد للأخطاء بحسب الفئات، وحق الجهة في إعادة الاختبار"},{"key":"ب","text":"أن تكون واجهة النظام بألوان الهوية البصرية المعتمدة في الجهة"},{"key":"ج","text":"أن يُدفع للمورّد بحسب عدد الطلبات التي يؤشّر عليها النظام"},{"key":"د","text":"أن يبقى النموذج وبيانات تدريبه سرًّا تجاريًّا لا تطّلع عليه الجهة"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الجهة تُسأل عن النظام، فتحتاج إلى أن تقيسه بنفسها. الدفع بحسب التأشير يكافئ التأشير الزائد، والسرية الكاملة تمنع التحقق.","misconceptions":["","يخلط بين الشكل والمساءلة","يربط أجر المورّد بعدد الأسر المؤشَّر عليها فيكافئ الخطأ","يتنازل عن القدرة على التحقق"],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"procurement-terms","title":"العقد يحفظ قدرتك على أن تُسأل عن النظام"},"level":"apply","pool":"practice"}]}</script>
